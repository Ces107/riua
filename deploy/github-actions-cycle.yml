name: cycle

# The scheduled worker: every 10 minutes it ingests radar, gauges and the model runs that
# have appeared since the last pass, recomputes the three horizons and publishes the
# product together with the static site. New radar composites arrive every 5-10 min,
# AROME every hour (15-min product) and every 3 h, ICON-EU every 3 h, IFS/ENS every 6-12 h;
# the pipeline only downloads runs it has not seen (state is kept in the Actions cache).

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "backend/**", "geo/out/**", "geo/hydro/**", ".github/workflows/cycle.yml"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write        # each run starts the next one (GitHub's cron is best-effort and often skipped)

concurrency:
  group: cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Start clock
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        # pinned to the last set that ran (backend/constraints.txt): an upstream release (netCDF4 1.7.5, 2026-10-15)
        # made the process crash on exit and stopped every deploy for 27 h
        run: pip install -r backend/requirements.txt -c backend/constraints.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: riua-state-${{ github.run_id }}
          restore-keys: riua-state-

      - name: Channel capacities
        run: python geo/hydro/build_capacity.py

      # The data step never decides on its own exit code (a native-library crash at exit used to fail the whole run
      # after the snapshot was ready): what counts is whether a good snapshot exists. Lighter modes are tried when
      # the full cycle produces none, and as a last resort the previous good snapshot is published (the page shows
      # "Desactualizado") so that the site and its code stay up; that run is then marked failed so it is noticed.
      - name: Production cycle
        id: cycle
        working-directory: backend
        env:
          RIUA_ENS_CACHE: ${{ github.workspace }}/state/ens_cache
          MPLBACKEND: Agg
        run: |
          set +e
          status=none
          for mode in "" "--no-ens" "--no-radar --no-ens"; do
            rm -f ../web/data/snapshot.json
            timeout 1000 python -m riua.product --state ../state --out ../web/data $mode
            rc=$?
            if python -m riua.check_snapshot ../web/data/snapshot.json 30; then
              status=ok; echo "cycle ok (mode '${mode:-full}', exit code $rc)"; break
            fi
            echo "::warning::cycle produced no good snapshot (mode '${mode:-full}', exit code $rc); trying a lighter mode"
          done
          if [ "$status" = ok ]; then
            mkdir -p ../state/last_good && rm -rf ../state/last_good/* && cp -r ../web/data/. ../state/last_good/
          elif [ -s ../state/last_good/snapshot.json ]; then
            mkdir -p ../web/data && cp -r ../state/last_good/. ../web/data/ && status=stale
            echo "::error::no mode produced a snapshot: publishing the previous good one"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" = none ] && exit 1
          exit 0

      - name: Share card
        if: steps.cycle.outputs.status == 'ok'
        continue-on-error: true
        working-directory: backend
        run: python -c "import json,pathlib; from riua import card; card.from_snapshot(json.loads(pathlib.Path('../web/data/snapshot.json').read_text(encoding='utf-8')), pathlib.Path('../web/data/og.png'))"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: riua-state-${{ github.run_id }}

      - name: Static geodata for the page
        if: always() && steps.cycle.outputs.status != 'none' && steps.cycle.outputs.status != ''
        run: python web/dev/build_geo.py

      - name: Drop development fixtures
        if: always() && steps.cycle.outputs.status != 'none' && steps.cycle.outputs.status != ''
        run: rm -rf web/dev

      # A new page must never run with a cached older stylesheet or script: stamp them per deploy.
      # (the unversioned js/ stays so that a cached older page keeps working for its 10 minutes)
      - name: Version the assets
        if: always() && steps.cycle.outputs.status != 'none' && steps.cycle.outputs.status != ''
        run: |
          v=${{ github.run_id }}
          cp -r web/js "web/js-$v"
          sed -i "s#\"js/#\"js-$v/#g; s#css/riua.css#css/riua.css?v=$v#g" web/*.html

      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.cycle.outputs.status != 'none' && steps.cycle.outputs.status != ''
        with:
          path: web

      - id: deploy
        if: always() && steps.cycle.outputs.status != 'none' && steps.cycle.outputs.status != ''
        uses: actions/deploy-pages@v4

      # Self-sustained 10-minute cycle: wait out the interval, then dispatch the next run,
      # unless another one is already queued (a push or the cron fallback got there first).
      - name: Next cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - START ))
          [ "$elapsed" -lt 540 ] && sleep $(( 540 - elapsed ))
          # a run stuck in the queue for more than 15 min blocked the chain for 7 h on 2026-10-05: cancel it
          now=$(date +%s)
          gh run list --workflow cycle.yml --limit 20 --json status,databaseId,createdAt             --jq '.[] | select((.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested") and .databaseId != ${{ github.run_id }}) | "\(.databaseId) \(.createdAt)"' |
          while read id t; do
            age=$(( now - $(date -d "$t" +%s) ))
            if [ "$age" -gt 900 ]; then echo "cancel stale $id ($age s)"; gh run cancel "$id" || true; fi
          done
          others=$(gh run list --workflow cycle.yml --limit 20 --json status,databaseId,createdAt             --jq "[.[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"pending\" or .status==\"waiting\" or .status==\"requested\") and .databaseId != ${{ github.run_id }} and ((now - (.createdAt | fromdate)) < 900))] | length")
          if [ "$others" = "0" ]; then gh workflow run cycle.yml --ref main; else echo "another run is already waiting"; fi

      # the previous snapshot was published instead of a new one: the run is red so that it is seen (and the
      # watchdog workflow reports it), but the site stayed up
      - name: Flag a stale publish
        if: always() && steps.cycle.outputs.status == 'stale'
        run: |
          echo "::error::published the previous good snapshot: this cycle could not produce a new one"
          exit 1
